services:
  - type: web
    name: argus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LOOM_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://frontend-eight-theta-43.vercel.app
